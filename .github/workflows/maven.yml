name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
        server-id: github
        repositories: |
          [
            {
              "id": "github",
              "url": "https://maven.pkg.github.com/tim9h/*",
              "snapshots": true
            }
          ]

    # Runs on Pull Requests only (Build & Test)
    - name: Build with Maven
      if: github.event_name == 'pull_request'
      run: mvn -B package --file pom.xml
      env:
        GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_PAT }}

    # Runs on Push to master only (Build, Test & Deploy)
    - name: Publish to GitHub Packages
      if: github.event_name == 'push'
      run: mvn -B deploy --file pom.xml -DskipTests=false
      env:
        GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_PAT }}