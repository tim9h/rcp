name: Java CI with Maven

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

          mvn-server-credentials: |
            gh-read-packages:PACKAGES_READ_USERNAME:PACKAGES_READ_TOKEN
            github:GITHUB_ACTOR:GITHUB_TOKEN

      - name: Build and test
        if: github.event_name == 'pull_request'
        run: mvn -B verify

      - name: Build, test and publish Maven package
        if: github.event_name == 'push'
        run: mvn -B deploy

      - name: Get Maven version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: version
        run: |
          VERSION=$(mvn -B help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Maven version: $VERSION"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR="rcp.core/target/rcp.core-${VERSION}.jar"

          test -f "$JAR" || {
            echo "JAR not found: $JAR"
            exit 1
          }

          gh release create "v${VERSION}" \
            "$JAR" \
            --title "v${VERSION}" \
            --generate-notes
