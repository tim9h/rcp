name: Java CI with Maven

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

          mvn-server-credentials: |
            gh-read-packages:PACKAGES_READ_USERNAME:PACKAGES_READ_TOKEN
            github:GITHUB_ACTOR:GITHUB_TOKEN

      - name: Build and test
        if: github.event_name == 'pull_request'
        run: mvn -B verify

      - name: Build, test and publish Maven package
        if: github.event_name == 'push'
        run: mvn -B deploy

  windows-app-image:
    needs: build
    runs-on: windows-latest

    env:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
          mvn-server-credentials: |
            gh-read-packages:PACKAGES_READ_USERNAME:PACKAGES_READ_TOKEN
            github:GITHUB_ACTOR:GITHUB_TOKEN

      - name: Build Windows app-image
        run: mvn -B package

      - name: Archive portable app-image
        run: Compress-Archive -Path rcp.core/target/RCP -DestinationPath rcp.core/target/RCP-windows-x64.zip

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $version = mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout
          gh release create "v$version" `
            "rcp.core/target/RCP-windows-x64.zip" `
            --title "v$version" `
            --generate-notes
