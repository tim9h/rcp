name: Java CI with Maven

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      PACKAGES_READ_USERNAME: ${{ secrets.PACKAGES_READ_USERNAME }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

          mvn-server-credentials: |
            collections:PACKAGES_READ_USERNAME:PACKAGES_READ_TOKEN
            github:GITHUB_ACTOR:GITHUB_TOKEN

      - name: Build and test
        run: mvn -B verify

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: mvn -B deploy
