name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
        server-id: github
        server-username: ${{ github.actor }}
        server-password: ${{ secrets.READ_PACKAGES_PAT }}

    # Runs on Pull Requests only (Build & Test)
    - name: Build with Maven
      if: github.event_name == 'pull_request'
      run: mvn -B package --file pom.xml

    # Runs on Push to master only (Build, Test & Deploy)
    - name: Publish to GitHub Packages
      if: github.event_name == 'push'
      run: mvn -B deploy --file pom.xml -DskipTests=false